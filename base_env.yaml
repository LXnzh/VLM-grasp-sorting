sim:
  headless: false # Set to false for GUI mode
  scene_dir: "models/ur10e_2f85/scene.xml"
  #scene_dir: "models/ur10e_2f85/combined_ur10e_2f85_scene.xml"
  # available cameras: camera_orbbec_static, camera_realsense, camera_third_person, camera_orbbec, 
  camera_names: ["camera_third_person", "camera_orbbec"] # max 2 cameras supported
  control_timestep: 0.02
  # Seconds between slow-loop performance messages. Set 0 to disable them.
  performance_log_interval: 0
  # ROS publish settings (tune to avoid rosbridge overload)
  # ros_publish_hz: maximum joint_states publish rate (Hz). If omitted, defaults to min(sim_rate,50).
  ros_publish_hz: 20
  # ros_position_tol: minimum change in joint position (rad) to trigger a publish
  ros_position_tol: 1e-4
  render_fps: 20
  camera_size: [1280, 720]
  enable_pointcloud_camera1: true
  enable_pointcloud_camera2: true
  enable_depth_camera1: true
  enable_depth_camera2: true
  tf_parent_frame: base_link
  pointcloud_profile: false        # set true to log per-stage timings
  pointcloud_profile_log_every: 10
  pointcloud_fps: 1                   # throttle pointcloud generation independently from render_fps
  pointcloud_stride: 2                # use every 2nd pixel in x/y for pointclouds (4x fewer points)
  pointcloud_transform:
    cameras:
      camera_orbbec_static:
        frame: local                  # apply rotation/translation in camera frame
        translation: [0.0, 0.0, 0.0]  # additional shift for this camera
        rpy_deg: [180, 0.0, 0.0]      # additional rotation for this camera
      camera_realsense:
        frame: local
        translation: [0.0, 0.0, 0.0]
        rpy_deg: [180, 0.0, 0.0]
  

# Each startup: always include these grasp-profile test objects first.
fixed_object_names:
  # - "apple"
  # - "tomato_soup_can"
  # - "banana"
  # - "gelatin_box"
  - "apple"
  - "tennis_ball"
  - "orange"
  - "gelatin_box"
  # - "tennis_ball"

# Fill up to this many objects. If fixed_object_names has more entries, keep all fixed objects.
random_object_count: 4

# Keep random objects clear of the sorting-bin row. Individual object ranges
# below remain as backward-compatible defaults for runs that omit this override.
object_position_range:
  x: [-0.70, -0.42]
  y: [-0.20, 0.28]
  z: [0.0, 0.02]

# Open-set food sorting targets. The grasp side estimates their actual positions
# from the saved RGB-D frame; the simulator does not publish ground-truth poses.
# Keep this default separate from the pipeline; use a dedicated single-bin config
# for the simplified classification demo.
classification_bins:
  enabled: false
  jitter_xy: [0.015, 0.015]
  bins: []

# Dedicated single-bin classification setup for the simplified demo.
classification_bins_single_random:
  enabled: true
  random_color: true
  # Uniformly randomized on every MuJoCo startup. This region stays visible,
  # reachable and separated from the YCB object region below.
  position_range:
    x: [-0.65, -0.55]
    y: [0.38, 0.48]
  bins:
    - category: "food"
      name: "food_bin"
      center_xy: [-0.55, 0.45]
      inner_size: [0.24, 0.20]
      wall_height: 0.10
      wall_thickness: 0.01
      floor_thickness: 0.01
      color: [0.0, 1.0, 1.0, 1.0]

