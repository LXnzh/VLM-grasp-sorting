sim:
  headless: false # Set to false for GUI mode
  scene_dir: "models/ur10e_2f85/scene.xml"
  #scene_dir: "models/ur10e_2f85/combined_ur10e_2f85_scene.xml"
  # available cameras: camera_orbbec_static, camera_realsense, camera_third_person, camera_orbbec, 
  # Perception consumes only camera_orbbec RGB + depth. Keep the unused
  # third-person camera out of camera_names so its RGB is not rendered.
  camera_names: ["camera_orbbec"] # max 2 cameras supported
  control_timestep: 0.02
  # ROS publish settings (tune to avoid rosbridge overload)
  # ros_publish_hz: maximum joint_states publish rate (Hz). If omitted, defaults to min(sim_rate,50).
  ros_publish_hz: 20
  # ros_position_tol: minimum change in joint position (rad) to trigger a publish
  ros_position_tol: 1e-4
  render_fps: 0.2
  camera_size: [1280, 720]
  enable_pointcloud_camera1: false
  enable_pointcloud_camera2: false
  enable_depth_camera1: true
  enable_depth_camera2: false
  tf_parent_frame: base_link
  pointcloud_profile: false        # set true to log per-stage timings
  pointcloud_profile_log_every: 10
  pointcloud_fps: 1                   # throttle pointcloud generation independently from render_fps
  pointcloud_stride: 2                # use every 2nd pixel in x/y for pointclouds (4x fewer points)
  pointcloud_transform:
    cameras:
      camera_orbbec_static:
        frame: local                  # apply rotation/translation in camera frame
        translation: [0.0, 0.0, 0.0]  # additional shift for this camera
        rpy_deg: [180, 0.0, 0.0]      # additional rotation for this camera
      camera_realsense:
        frame: local
        translation: [0.0, 0.0, 0.0]
        rpy_deg: [180, 0.0, 0.0]
  

# Direct simulator entrypoints keep the current stable scene unless overridden.
scene_mode: "mix"

# scene_mode=assign: required objects in slot order. The launch prompt fills
# this list; any remaining slots are sampled from the rest of the object pool.
assigned_object_names: []

# Ordered grasp-category pools for scene_mode=random. Category order maps to
# placement slots 1-5; banana and hammer are intentionally singleton pools.
scene_object_categories:
  cylindrical_can:
    - "tomato_soup_can"
  banana:
    - "banana"
  round_top:
    - "apple"
    - "lemon"
    - "peach"
    - "pear"
    - "orange"
    - "plum"
    - "baseball"
    - "tennis_ball"
    - "racquetball"
  box:
    - "gelatin_box"
    - "sponge"
    - "foam_brick"
    - "rubiks_cube"
  tool_top:
    - "hammer"

# scene_mode=mix: always include these target objects first, then randomly fill.
fixed_object_names:
  - "tomato_soup_can"
  - "banana"
  - "apple"
  - "foam_brick"
  - "hammer"

# Fill up to this many objects. If fixed_object_names has more entries, keep all fixed objects.
random_object_count: 6

# Fixed grasp-friendly initial table slots. Object identities may vary, but
# selected objects are placed in these slots in selection order.
placement_slots:
  - [-0.74, -0.08, 0.0]
  - [-0.55, -0.08, 0.0]
  - [-0.36, -0.08, 0.0]
  - [-0.74, 0.20, 0.0]
  - [-0.55, 0.30, 0.0]
  - [-0.85, 0.35, 0.0]
# YCB scene-generation pool (16 release-qualified objects)
